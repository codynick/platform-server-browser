name: Browser edition checks
on: [push, pull_request]
jobs:
  python314:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install pyserial==3.5 requests==2.32.5 keyboard==0.13.5 mysql-connector-python==9.4.0
      - run: PYTHONPATH=upstream/components/client python -c "import CodyNick, Dashboard, SpriteStage; print('Non-AI libraries import on Python 3.14')"
      - run: python -m unittest discover -s tests -v
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y php-cli
      - run: python -m unittest discover -s tests -v
      - run: bash -n setup.sh
      - run: node tools/test_execution.cjs
      - run: find upstream/components/ide -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Install on disposable x86 Ubuntu VM
        run: |
          sudo mkdir -p /opt/codynick-multi/releases/test
          sudo cp -a . /opt/codynick-multi/releases/test/
          sudo python3 /opt/codynick-multi/releases/test/tools/ci_accounts.py
          sudo python3 -u /opt/codynick-multi/releases/test/install.py install
      - run: sudo python3 tests/vm_acceptance.py
      - name: Verify same-version upgrade preserves designs
        run: |
          sudo python3 -u /opt/codynick-multi/releases/test/install.py install
          sudo python3 tests/vm_acceptance.py
      - name: Check mobile IDE in a real browser
        env:
          PLAYWRIGHT_MODULE: /tmp/codynick-mobile-check/node_modules/playwright
          BASE_URL: http://127.0.0.1
        run: |
          npm install --prefix /tmp/codynick-mobile-check playwright
          node /tmp/codynick-mobile-check/node_modules/playwright/cli.js install --with-deps chromium
          node tools/test_mobile.cjs
          node tools/test_browser_runtime.cjs
          node tools/test_block_demos.cjs
          python tools/check_demo_behaviour.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ide-screenshots
          path: test-output/*.png
          if-no-files-found: ignore
      - name: Failure diagnostics
        if: failure()
        run: |
          sudo systemctl status codynick-multi-alice codynick-multi-bob codynick-multi-gateway codynick-multi-admin apache2 --no-pager -l || true
          sudo journalctl -u codynick-multi-alice -u codynick-multi-bob -u codynick-multi-gateway -u codynick-multi-admin -n 100 --no-pager || true
          sudo tail -n 80 /var/log/apache2/codynick-multi-*.log || true
