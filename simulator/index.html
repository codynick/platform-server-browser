<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodyNick Simulator</title><link rel="stylesheet" href="/simulator/style.css"><link rel="icon" type="image/x-icon" href="/simulator/favicon.ico"><link rel="stylesheet" href="/assets/tool-navigation.css"><style>body{visibility:hidden}</style><script src="/blocks/accounts.js?v=20261027-header5" defer></script></head>
<body><header class="tool-page-header"><a id="mainPanel" class="codynick-home-button" href="/blocks/">Block Editor</a><div class="logo-box"><img src="/assets/codynick-logo.png" alt="CodyNick — Bridging Ideation to Creation" draggable="false"></div><div class="tool-header-copy"><div class="header-title">CodyNick Simulator</div><div class="header-subtitle">Explore your gadgets</div></div></header>
<main><dialog id="gadgetPicker" aria-labelledby="gadgetPickerTitle"><div class="picker-heading"><h1 id="gadgetPickerTitle">Add a gadget</h1><button id="closeGadgets" aria-label="Close gadget picker">×</button></div><aside><div class="toolbox">
<button class="tool" draggable="false" data-add="seven" title="Click to add to the stage"><img src="/simulator/seven-segment.svg" alt=""><span>Seven-segment</span><b aria-hidden="true">+</b></button>
<button class="tool" draggable="false" data-add="temperature" title="Click to add to the stage"><img src="/simulator/sensor.png" alt=""><span>Temperature</span><b aria-hidden="true">+</b></button>
<button class="tool" draggable="false" data-add="matrix" title="Click to add to the stage"><img src="/simulator/matrix.svg" alt=""><span>LED matrix</span><b aria-hidden="true">+</b></button>
<button class="tool" draggable="false" data-add="joystick" title="Click to add to the stage"><img src="/simulator/joystick.png" alt=""><span>Joystick</span><b aria-hidden="true">+</b></button>
<button class="tool" draggable="false" data-add="ultrasonic" title="Click to add to the stage"><img src="/simulator/ultrasonic.png" alt=""><span>Ultrasonic</span><b aria-hidden="true">+</b></button>
<button class="tool" draggable="false" data-add="soil" title="Click to add to the stage"><img src="/simulator/soil.png" alt=""><span>Soil moisture</span><b aria-hidden="true">+</b></button>
<button class="tool" draggable="false" data-add="wifi" title="Click to add to the stage"><img src="/simulator/wifi.png" alt=""><span>Wi-Fi / IoT</span><b aria-hidden="true">+</b></button><button class="tool" draggable="false" data-add="motion"><span>PIR motion</span><b>+</b></button><button class="tool" draggable="false" data-add="rfid"><span>RFID</span><b>+</b></button><button class="tool" draggable="false" data-add="ultraseg"><span>UltraSeg</span><b>+</b></button></div>
<dl><dt>Live program</dt><dd id="python">Waiting</dd><dt>Joystick</dt><dd id="direction">Neutral</dd><dt>Buzzer</dt><dd id="note">Silent</dd><dt>7-segment</dt><dd id="displayValue">Not added</dd></dl><button id="sound" title="Enable or mute simulated buzzer">Enable sound</button><p id="soundStatus" role="status"></p></aside></dialog>
<section class="workspace"><div class="toolbar"><button id="addGadgets" aria-haspopup="dialog" aria-controls="gadgetPicker">Add gadget</button><span id="selected">CodyJoy Pro</span><output id="zoomLevel" aria-label="Stage zoom">100%</output><span class="view-help" title="Scroll to zoom · Drag empty stage to pan · Double-click or press Home to fit" aria-label="Stage navigation help">ⓘ</span><span id="saved" role="status">Loading layout</span></div><p id="error" role="alert" hidden></p><div id="stageViewport" tabindex="0" role="region" aria-label="Simulation stage. Scroll to zoom, drag empty space to pan. Press Home to fit all gadgets."><div id="stage" aria-label="Gadget simulation stage">
<section class="stage-item" id="gadget-cjp" data-kind="cjp"><div class="gadget-header"><button class="handle" aria-label="Move CodyJoy Pro" title="Drag to move CodyJoy Pro"><span class="gadget-title">CodyJoy Pro</span><span class="drag-grip" aria-hidden="true">✥</span></button></div><div class="device"><img src="/simulator/gadget.svg" alt="CodyJoy Pro enclosure"><div id="leds" aria-label="16 RGB LEDs"></div><div class="joystick" aria-label="Simulated joystick"><button data-state="UP" title="Joystick up" aria-label="Joystick up">&#8593;</button><button data-state="LEFT" title="Joystick left" aria-label="Joystick left">&#8592;</button><button data-state="CLICK" title="Joystick click" aria-label="Joystick click">&#9679;</button><button data-state="RIGHT" title="Joystick right" aria-label="Joystick right">&#8594;</button><button data-state="DOWN" title="Joystick down" aria-label="Joystick down">&#8595;</button></div></div></section>
<section class="stage-item" id="gadget-seven" data-kind="seven" hidden><div class="gadget-header"><button class="gadget-remove" data-remove="seven" title="Remove Seven-segment display" aria-label="Remove Seven-segment display">×</button><button class="handle" aria-label="Move Seven-segment display" title="Drag to move Seven-segment display"><span class="gadget-title">Seven-segment display</span><span class="drag-grip" aria-hidden="true">✥</span></button></div><div class="seven-device"><img src="/simulator/seven-segment.svg" alt="Stand-Alone seven-segment display enclosure"><div id="sevenDigits" role="img" aria-label="Seven-segment display: blank"></div></div></section>
<section class="stage-item" id="gadget-temperature" data-kind="temperature" hidden><div class="gadget-header"><button class="gadget-remove" data-remove="temperature" title="Remove Temperature sensor" aria-label="Remove Temperature sensor">×</button><button class="handle" aria-label="Move Temperature sensor" title="Drag to move Temperature sensor"><span class="gadget-title">Temperature sensor</span><span class="drag-grip" aria-hidden="true">✥</span></button></div><div class="sensor-device"><img src="/simulator/sensor.png" alt="Simulated temperature probe"><div class="sensor-controls"><label for="temperatureValue">Temperature (&deg;C)</label><input id="temperatureValue" type="number" min="-55" max="125" step="0.1" value="21.1"><input id="temperatureSlider" type="range" min="-55" max="125" step="0.1" value="21.1" aria-label="Simulated temperature"></div></div></section>
<section class="stage-item" id="gadget-matrix" data-kind="matrix" hidden><div class="gadget-header"><button class="gadget-remove" data-remove="matrix" title="Remove LED matrix" aria-label="Remove LED matrix">×</button><button class="handle" aria-label="Move LED matrix" title="Drag to move LED matrix"><span class="gadget-title">LED matrix</span><span class="drag-grip" aria-hidden="true">✥</span></button></div><div class="matrix-device"><img src="/simulator/matrix.svg" alt="8 by 8 single-color LED matrix enclosure"><div id="matrixPixels" role="img" aria-label="8 by 8 LED matrix"></div></div><output id="matrixText"></output></section>
</div></div></section></main><script src="/blocks/live-store.js"></script><script src="/simulator/font5x7.js"></script><script src="/simulator/viewport.js"></script><script src="/simulator/app.js"></script></body></html>
